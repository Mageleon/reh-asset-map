<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ras El Hekma – Master Asset Map</title>
  <!-- MapLibre GL JS 5.24.0 (BSD-3-Clause). integrity = fingerprint: the browser refuses the file if it was altered. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"
          integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app" id="app" data-layout="wide" data-left="open" data-right="open">
    <header class="app-header" id="app-header"></header>
    <aside class="panel panel--left" id="left-panel" aria-label="Filters and layers"></aside>
    <main class="map-region" aria-label="Masterplan map">
      <div id="map" class="map"></div>
      <div id="map-message" class="map-message" role="status" hidden></div>
    </main>
    <aside class="panel panel--right" id="right-panel" aria-label="Plot information"></aside>
  </div>
  <noscript>This application needs JavaScript enabled in your browser.</noscript>
</body>
</html>
